{{ if .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zeebe-cluster.names.gateway" . }}
  labels:
    {{- include "zeebe-cluster.labels.gateway" . | nindent 4 }}
    {{- if .Values.gateway.ingress.labels }}
    {{- toYaml  .Values.gateway.ingress.labels | nindent 4 }}
    {{- end }}
  annotations:
    {{- toYaml .Values.gateway.ingress.annotations | nindent 4 }}
spec:
  rules:
  - host: {{ .Values.gateway.ingress.hostName }}
    http:
      paths:
      - backend:
          service:
            name: {{ include "zeebe-cluster.names.gateway" . }}
            port:
              number: {{ .Values.serviceHttpPort }}
        path: /
        pathType: ImplementationSpecific
      - backend:
          service:
            name: {{ include "zeebe-cluster.names.gateway" . }}
            port:
              number: {{ .Values.serviceGatewayPort }}
        path: /
        pathType: ImplementationSpecific
{{ end }}
